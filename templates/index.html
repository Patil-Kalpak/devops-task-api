<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Manager - DevOps Project</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }

        h1 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .task-form {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        input, select, button {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filters {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #e9ecef;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-label {
            font-weight: 600;
            color: #333;
        }

        .tasks-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
        }

        .section-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .task-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            position: relative;
        }

        .task-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .task-card.completed {
            opacity: 0.7;
            background: #f8f9fa;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .task-title {
            font-size: 1.2em;
            color: #333;
            font-weight: 600;
            flex: 1;
        }

        .task-card.completed .task-title {
            text-decoration: line-through;
            color: #999;
        }

        .task-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            background: #f8f9fa;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .priority-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .priority-critical {
            background: #dc3545;
            color: white;
        }

        .priority-high {
            background: #fd7e14;
            color: white;
        }

        .priority-medium {
            background: #ffc107;
            color: #333;
        }

        .priority-low {
            background: #28a745;
            color: white;
        }

        .task-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-complete {
            background: #28a745;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .btn-complete:hover {
            background: #218838;
            transform: scale(1.05);
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .btn-delete:hover {
            background: #c82333;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .timestamp {
            font-size: 0.85em;
            color: #999;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .filters {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

<div class="notification" id="notification"></div>

<div class="container">
    <header>
        <h1>🚀 Smart Task Manager updated</h1>
        <p class="subtitle">Collaborative DevOps Task Management System</p>
    </header>

    <!-- Task Form -->
    <div class="task-form">
        <div class="form-row">
            <input type="text" id="taskInput" placeholder="Enter task description..." maxlength="200">
            <select id="userSelect">
                <option value="">Select User</option>
                <option value="Alice Johnson">Alice Johnson</option>
                <option value="Bob Smith">Bob Smith</option>
                <option value="Charlie Davis">Charlie Davis</option>
                <option value="Diana Martinez">Diana Martinez</option>
                <option value="Ethan Brown">Ethan Brown</option>
            </select>
            <select id="prioritySelect">
                <option value="Low">Low Priority</option>
                <option value="Medium" selected>Medium Priority</option>
                <option value="High">High Priority</option>
                <option value="Critical">Critical</option>
            </select>
        </div>
        <button onclick="addTask()" style="width: 100%;">➕ Add New Task</button>
    </div>

    <!-- Stats -->
    <div class="stats-container" id="statsContainer">
        <div class="stat-card">
            <div class="stat-number" id="statTotal">0</div>
            <div class="stat-label">Total Tasks</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="statCompleted">0</div>
            <div class="stat-label">Completed</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="statPending">0</div>
            <div class="stat-label">Pending</div>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters">
        <span class="filter-label">Filter by:</span>
        <select id="filterUser" onchange="loadTasks()">
            <option value="">All Users</option>
            <option value="Alice Johnson">Alice Johnson</option>
            <option value="Bob Smith">Bob Smith</option>
            <option value="Charlie Davis">Charlie Davis</option>
            <option value="Diana Martinez">Diana Martinez</option>
            <option value="Ethan Brown">Ethan Brown</option>
        </select>
        <select id="filterStatus" onchange="loadTasks()">
            <option value="">All Status</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
        </select>
        <select id="filterPriority" onchange="loadTasks()">
            <option value="">All Priorities</option>
            <option value="Critical">Critical</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
        </select>
    </div>

    <!-- Tasks List -->
    <div class="tasks-section">
        <h2 class="section-title">📋 Task List</h2>
        <div id="taskList"></div>
    </div>
</div>

<script>
    // Load tasks and stats on page load
    window.onload = function() {
        loadTasks();
        loadStats();
    };

    // Auto-refresh every 3 seconds
    setInterval(() => {
        loadTasks();
        loadStats();
    }, 3000);

    async function loadTasks() {
        try {
            const userFilter = document.getElementById('filterUser').value;
            const statusFilter = document.getElementById('filterStatus').value;
            const priorityFilter = document.getElementById('filterPriority').value;

            let url = '/tasks?';
            if (userFilter) url += `user=${encodeURIComponent(userFilter)}&`;
            if (statusFilter) url += `status=${statusFilter}&`;
            if (priorityFilter) url += `priority=${priorityFilter}&`;

            const response = await fetch(url);
            const tasks = await response.json();

            const taskList = document.getElementById('taskList');

            if (tasks.length === 0) {
                taskList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>No tasks found</h3>
                        <p>Add a new task to get started!</p>
                    </div>
                `;
                return;
            }

            let html = '';
            tasks.forEach(task => {
                const priorityClass = `priority-${task.priority.toLowerCase()}`;
                const completedClass = task.status === 'completed' ? 'completed' : '';
               
                html += `
                    <div class="task-card ${completedClass}">
                        <div class="task-header">
                            <div class="task-title">${escapeHtml(task.task)}</div>
                        </div>
                        <div class="task-meta">
                            <div class="meta-item">
                                👤 ${escapeHtml(task.user)}
                            </div>
                            <div class="priority-badge ${priorityClass}">
                                ${task.priority}
                            </div>
                            <div class="meta-item">
                                🕐 ${task.created_at}
                            </div>
                        </div>
                        <div class="task-actions">
                            ${task.status === 'pending' ?
                                `<button class="btn-complete" onclick="completeTask(${task.id})">✓ Mark Complete</button>` :
                                `<span style="color: #28a745; font-weight: 600;">✓ Completed</span>`
                            }
                            <button class="btn-delete" onclick="deleteTask(${task.id})">🗑 Delete</button>
                        </div>
                    </div>
                `;
            });

            taskList.innerHTML = html;
        } catch (error) {
            console.error('Error loading tasks:', error);
            showNotification('Error loading tasks', 'error');
        }
    }

    async function loadStats() {
        try {
            const response = await fetch('/stats');
            const stats = await response.json();

            document.getElementById('statTotal').textContent = stats.total;
            document.getElementById('statCompleted').textContent = stats.completed;
            document.getElementById('statPending').textContent = stats.pending;
        } catch (error) {
            console.error('Error loading stats:', error);
        }
    }

    async function addTask() {
        const task = document.getElementById('taskInput').value.trim();
        const user = document.getElementById('userSelect').value;
        const priority = document.getElementById('prioritySelect').value;

        if (!task) {
            showNotification('Please enter a task description', 'error');
            return;
        }

        if (!user) {
            showNotification('Please select a user', 'error');
            return;
        }

        try {
            const response = await fetch('/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task, user, priority })
            });

            const data = await response.json();

            if (response.ok) {
                showNotification('Task added successfully! 🎉', 'success');
                document.getElementById('taskInput').value = '';
                document.getElementById('userSelect').value = '';
                document.getElementById('prioritySelect').value = 'Medium';
                loadTasks();
                loadStats();
            } else {
                showNotification(data.error || 'Failed to add task', 'error');
            }
        } catch (error) {
            console.error('Error adding task:', error);
            showNotification('Error adding task', 'error');
        }
    }

    async function completeTask(id) {
        try {
            const response = await fetch(`/complete/${id}`, { method: 'PUT' });
           
            if (response.ok) {
                showNotification('Task completed! ✓', 'success');
                loadTasks();
                loadStats();
            } else {
                showNotification('Failed to complete task', 'error');
            }
        } catch (error) {
            console.error('Error completing task:', error);
            showNotification('Error completing task', 'error');
        }
    }

    async function deleteTask(id) {
        if (!confirm('Are you sure you want to delete this task?')) {
            return;
        }

        try {
            const response = await fetch(`/delete/${id}`, { method: 'DELETE' });
           
            if (response.ok) {
                showNotification('Task deleted successfully', 'success');
                loadTasks();
                loadStats();
            } else {
                showNotification('Failed to delete task', 'error');
            }
        } catch (error) {
            console.error('Error deleting task:', error);
            showNotification('Error deleting task', 'error');
        }
    }

    function showNotification(message, type = 'success') {
        const notification = document.getElementById('notification');
        notification.textContent = message;
        notification.style.background = type === 'success' ? '#28a745' : '#dc3545';
        notification.style.display = 'block';

        setTimeout(() => {
            notification.style.display = 'none';
        }, 3000);
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Allow Enter key to submit
    document.getElementById('taskInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            addTask();
        }
    });
</script>

</body>
</html>
